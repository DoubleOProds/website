  <style>
    .feature-img {
      width: 100%;
      max-width: 240px;
      filter: grayscale(0%);
      height: auto;
      transition: filter 0.3s, transform 0.3s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .feature-img:hover {
      transform: scale(1.01);
      filter: grayscale(0%);
    }

    h1, h2 {
      text-decoration: underline;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .artist {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      width: 200px;
    }

    .artist-name {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .show-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    @media (max-width: 600px) {
      .artist {
        width: 100%;
        max-width: 300px;
      }

      .show-container {
        justify-content: center;
      }
    }

    .image-rotator img {
      transition: opacity 0.5s ease-in-out;
      cursor: pointer;
    }

    /* Lightbox overlay for enlarged rotating image */
    #lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none; /* ⛔ blocks interaction when visible */
      transition: opacity 0.3s ease-in-out;
      visibility: hidden;
    }

    #lightbox.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: none; /* ✅ stays non-blocking even when visible */
    }

    #lightbox-img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none; /* ✅ also non-blocking */
    }

    #lightbox.visible #lightbox-img {
      opacity: 1;
      transform: scale(1.05);
    }
  </style>
</head>

  <!-- Lightbox Overlay -->
  <div id="lightbox" class="hidden">
    <img id="lightbox-img" src="" alt="Expanded Image">
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    let activeRotator = null;

    document.querySelectorAll('.image-rotator').forEach((rotator, i) => {
      const images = JSON.parse(rotator.dataset.images);
      const imgElement = rotator.querySelector('img');
      let index = 0;

      // Initial image
      imgElement.src = images[0];

      // Rotate images
      setInterval(() => {
        index = (index + 1) % images.length;
        imgElement.src = images[index];

        // Update lightbox if it's active
        if (lightbox.dataset.source === String(i)) {
          lightboxImg.src = images[index];
        }
      }, 2000);

      // Hover in: show lightbox
      rotator.addEventListener('mouseenter', () => {
        lightboxImg.src = imgElement.src;
        lightbox.dataset.source = String(i);
        lightbox.classList.add('visible');
        activeRotator = rotator;
      });
    });

    // Listen globally to mouse movement to detect when we leave the rotator
    document.addEventListener('mousemove', (e) => {
      if (!activeRotator) return;

      const rect = activeRotator.getBoundingClientRect();
      const within =
        e.clientX >= rect.left &&
        e.clientX <= rect.right &&
        e.clientY >= rect.top &&
        e.clientY <= rect.bottom;

      if (!within) {
        lightbox.classList.remove('visible');
        lightbox.dataset.source = "";
        activeRotator = null;
      }
    });
  </script>
