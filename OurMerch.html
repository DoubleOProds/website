<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Merch | Double O Productions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="DO favicon.png">

  <style>
    .feature-img {
      width: 100%;
      max-width: 240px;
      filter: grayscale(0%);
      height: auto;
      transition: filter 0.3s, transform 0.3s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .feature-img:hover {
      transform: scale(1.01);
      filter: grayscale(0%);
    }

    h1, h2 {
      text-decoration: underline;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .artist {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      width: 200px;
    }

    .artist-name {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .show-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    @media (max-width: 600px) {
      .artist {
        width: 100%;
        max-width: 300px;
      }

      .show-container {
        justify-content: center;
      }
    }

    .image-rotator img {
      transition: opacity 0.5s ease-in-out;
      cursor: pointer;
    }

    /* Lightbox overlay for enlarged rotating image */
    #lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: auto;
      transition: opacity 0.3s ease-in-out;
      visibility: hidden;
    }

    #lightbox.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #lightbox-img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    #lightbox.visible #lightbox-img {
      opacity: 1;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/dubsprods.jpg" alt="Double O Productions Logo" />
    </div>
    <nav>
      <a href="index.html">Home</a> <p> | </p>
      <a href="OurShows.html">Our Shows</a> <p> | </p>
      <a href="OurMusic.html">Our Music</a> <p> | </p>
      <a href="OurMerch.html">Our Store</a> <p> | </p>
      <a href="OurTeam.html">Our Team</a>
    </nav>
  </header>

  <main class="merch-section">
    <section>
      <h1>Our Merch</h1>
      <div class="show-container">

        <!-- Product 1 -->
        <a href="https://www.etsy.com/uk/listing/4334699313/limited-edition-classic-doubleo-white" class="artist" target="_blank">
          <div class="image-rotator" data-images='["images/White Tee Front.jpg", "images/White Tee Back.jpg"]'>
            <img src="images/White Tee Front.jpg" alt="Item 1" class="feature-img">
          </div>
          <div class="artist-name">Classic DoubleO White Tee (£19.14)</div>
        </a>

        <!-- Product 2 -->
        <a href="https://www.etsy.com/uk/listing/4334688177/limited-edition-doubleo-productions" class="artist" target="_blank">
          <div class="image-rotator" data-images='["images/Front, Black.jpg", "images/Back, Black.jpg"]'>
            <img src="images/Front, Black.jpg" alt="Item 2" class="feature-img">
          </div>
          <div class="artist-name">Classic DoubleO Long Sleeve Black Top (£31.98)</div>
        </a>

        <!-- Product 3 -->
        <a href="https://www.etsy.com/uk/listing/4334733430/the-classic-doubleo-beanie" class="artist" target="_blank">
          <div class="image-rotator" data-images='["images/Front, Black Hat.jpg", "images/Front, Dark Navy.jpg", "images/Front, Dark Green.jpg"]'>
            <img src="images/Front, Black Hat.jpg" alt="Item 3" class="feature-img">
          </div>
          <div class="artist-name">Classic DoubleO Beanie (£25.06)</div>
        </a>

        <!-- Product 4 -->
        <a href="https://www.etsy.com/uk/listing/4334770129/doubleo-official-amber-notes-tee" class="artist" target="_blank">
          <div class="image-rotator" data-images='[
            "images/colours/Front, Black AN.png",
            "images/colours/Back, Black AN.png",
            "images/colours/White AN.png",
            "images/colours/Antique Cherry Red AN.png",
            "images/colours/Indigo Blue AN.png",
            "images/colours/Sapphire AN.png",
            "images/colours/Military Green AN.png",
            "images/colours/Maroon AN.png",
            "images/colours/Daisy AN.png"
            ]'>
            <img src="images/AmberNotes/Front, Black-2.jpg" alt="Item 4" class="feature-img">
          </div>
          <div class="artist-name">DoubleO Official Amber Notes Tee (£28.32)</div>
        </a>

        <!-- Product 5 -->
        <a href="https://www.etsy.com/uk/listing/4337283915/doubleo-official-my-world-tee" class="artist" target="_blank">
          <div class="image-rotator" data-images='[
            "images/colours/Front, Black MW.png",
            "images/colours/Back, Black MW.png",
            "images/colours/White MW.png",
            "images/colours/Cardinal Red MW.png",
            "images/colours/Heather Royal MW.png",
            "images/colours/Antique Sapphire MW.png",
            "images/colours/Military Green MW.png",
            "images/colours/Purple MW.png",
            "images/colours/Graphite Heather MW.png"
            ]'>
            <img src="images/AmberNotes/Front, Black-3.jpg" alt="Item 5" class="feature-img">
          </div>
          <div class="artist-name">DoubleO Official My World Tee (£28.32)</div>
        </a>

      </div>
    </section>
  </main>

  <!-- Lightbox Overlay -->
  <div id="lightbox">
    <img id="lightbox-img" src="" alt="Expanded Image">
  </div>

   <script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  let activeRotator = null;
  let currentImages = [];
  let imageIndex = 0;
  let intervalId = null;

  document.querySelectorAll('.image-rotator').forEach((rotator) => {
    const images = JSON.parse(rotator.dataset.images);
    const imgElement = rotator.querySelector('img');

    rotator.addEventListener('mouseenter', () => {
      activeRotator = rotator;
      currentImages = images;
      imageIndex = 0;
      imgElement.src = currentImages[0];

      intervalId = setInterval(() => {
        imageIndex = (imageIndex + 1) % currentImages.length;
        imgElement.src = currentImages[imageIndex];
        lightboxImg.src = currentImages[imageIndex];
      }, 2000);

      lightboxImg.src = currentImages[0];
      lightbox.classList.add('visible');
    });

    rotator.addEventListener('mouseleave', () => {
      // Delay a bit so we can detect if mouse moved to preview
      setTimeout(() => {
        if (!isHoveringPreview()) {
          closeLightbox();
        }
      }, 100);
    });
  });

  lightboxImg.addEventListener('mouseleave', () => {
    // Delay in case mouse is quickly moving between merch and preview
    setTimeout(() => {
      if (!isHoveringPreview()) {
        closeLightbox();
      }
    }, 100);
  });

  function isHoveringPreview() {
    const hovered = document.querySelector(':hover');
    return (
      hovered &&
      (hovered.closest('.image-rotator') || hovered === lightboxImg)
    );
  }

  function closeLightbox() {
    lightbox.classList.remove('visible');
    activeRotator = null;
    clearInterval(intervalId);
  }
</script>

</body>
</html>
