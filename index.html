<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Double O Productions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="DO favicon.png">
</head>
<body>

   <header>
    <div class="logo">
      <img src="images/logos/dubsprods.jpg" alt="Double O Productions Logo" />
    </div>
    <nav>
      <a href="index.html">Home</a> <p> | </p>
      <a href="shows.html">Theatre</a> <p> | </p>
      <a href="music.html">Music</a> <p> | </p>
      <a href="store.html">Our Store</a> <p> | </p>
      <a href="team.html">Our Team</a>
    </nav>
  </header>
  
  <style>
    h1, h2 {
      text-decoration: underline;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      }
  </style>

<main>
  <h1>Some of our productions</h1>
  <br>
  <section class="scrolling-wheel">
    <div class="wheel-container" id="wheel-container">
      <!-- Dynamic latest 10 videos will be loaded here automatically -->
    </div>
  </section>

  <div class="feature-column">
    <a href="shows.html" class="feature-link">
      <div class="feature-box left-img">
        <img src="images/The Show.png" alt="Feature 1" class="feature-img" />
        <div class="feature-text">Explore Our Shows</div>
      </div>
    </a>

    <a href="music.html" class="feature-link">
      <div class="feature-box right-img">
        <img src="images/Music Producing.JPG" alt="Feature 1" class="feature-img" />
        <div class="feature-text">Explore Our Music</div>
      </div>
    </a>

    <a href="store.html" class="feature-link">
      <div class="feature-box left-img">
        <img src="images/Our Merch.jpg" alt="Feature 1" class="feature-img" />
        <div class="feature-text">Explore Our Store</div>
      </div>
    </a>

    <a href="team.html" class="feature-link">
      <div class="feature-box right-img">
        <img src="images/Join Our Team.jpg" alt="Feature 2" class="feature-img" />
        <div class="feature-text">Meet the Team</div>
      </div>
    </a>
  </div>
</main>

<script>
  // Intersection Observer for feature boxes
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.2 });

  document.querySelectorAll('.feature-box').forEach(box => {
    observer.observe(box);
  });

  // Fetch Latest YouTube Videos & Populate Infinite Wheel
  async function loadYouTubeVideos() {
    const wheelContainer = document.getElementById('wheel-container');
    if (!wheelContainer) return;

    // Double O Productions Channel ID extracted from your handle (@DoubleOProductions)
    const CHANNEL_ID = 'UCNyKJoUJoHl0CB9aX7UmTyA'; 
    const RSS_URL = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
    const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;

    try {
      const response = await fetch(API_URL);
      const data = await response.json();

      if (data.status === 'ok' && data.items) {
        wheelContainer.innerHTML = ''; // Clear fallback content

        // Grab only the latest 10 videos
        const latestVideos = data.items.slice(0, 10);

        latestVideos.forEach(item => {
          const videoId = item.link.split('v=')[1];
          const videoTitle = item.title;
          const videoUrl = item.link;
          const thumbnailUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

          const videoAnchor = document.createElement('a');
          videoAnchor.href = videoUrl;
          videoAnchor.className = 'wheel-item';
          videoAnchor.target = '_blank';

          videoAnchor.innerHTML = `
            <div class="thumb-wrapper">
              <img src="${thumbnailUrl}" alt="${videoTitle}" />
              <div class="description">${videoTitle}</div>
            </div>
          `;

          wheelContainer.appendChild(videoAnchor);
        });

        // Once items are added to the DOM, start the infinite auto-scroll wheel
        initAutoScroll();
      }
    } catch (error) {
      console.error('Error loading YouTube feed:', error);
    }
  }

  // Infinite Scroll Wheel Logic
  function initAutoScroll() {
    const wheelContainer = document.getElementById('wheel-container');
    if (!wheelContainer) return;

    let scrollAmount = 0;
    let scrollStep = 3;
    let delay = 4;
    let scrollTimeout;
    let isHovering = false;

    // Detect vertical phone display
    const isPortraitPhone = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
    if (isPortraitPhone) {
      scrollStep = 3;
      delay = 4;
    }

    function autoScroll() {
      if (!wheelContainer || isHovering) return;

      scrollAmount = wheelContainer.scrollLeft + scrollStep;

      // If it reaches the end, smoothly loop back to the beginning for infinity effect
      if (scrollAmount >= wheelContainer.scrollWidth - wheelContainer.clientWidth) {
        scrollAmount = 0;
      }

      wheelContainer.scrollTo({
        left: scrollAmount,
        behavior: 'smooth'
      });

      scrollTimeout = setTimeout(autoScroll, delay);
    }

    function startAutoScroll() {
      clearTimeout(scrollTimeout);
      autoScroll();
    }

    function stopAutoScroll() {
      clearTimeout(scrollTimeout);
    }

    // Initialize position and listeners
    scrollAmount = wheelContainer.scrollLeft;
    startAutoScroll();

    wheelContainer.addEventListener('scroll', () => {
      scrollAmount = wheelContainer.scrollLeft;
    });

    wheelContainer.addEventListener('mouseenter', () => {
      isHovering = true;
      stopAutoScroll();
    });

    wheelContainer.addEventListener('mouseleave', () => {
      isHovering = false;
      startAutoScroll();
    });
  }

  // Run on page load
  window.addEventListener('DOMContentLoaded', loadYouTubeVideos);
</script>

</body>
</html>
