<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double O Productions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="DO favicon.png">
</head>
<body>

<header>
  <div class="logo">
    <img src="images/dubsprods.jpg" alt="Double O Productions Logo" />
  </div>
  <nav>
    <a href="index.html">Home</a><p>|</p>
    <a href="OurShows.html">Our Shows</a><p>|</p>
    <a href="OurMusic.html">Our Music</a><p>|</p>
    <a href="OurMerch.html">Our Store</a><p>|</p>
    <a href="OurTeam.html">Our Team</a>
  </nav>
</header>

<main>
  <h1>Some of our productions</h1>
  <section class="scrolling-wheel">
    <div class="wheel-container">
      <!-- your video items go here -->
      <!-- NOTE: You don’t need to duplicate them manually; JS will do it -->
      <a href="https://www.youtube.com/watch?v=sRQbLA71RQs" class="wheel-item" target="_blank">
        <div class="thumb-wrapper">
          <img src="https://img.youtube.com/vi/sRQbLA71RQs/hqdefault.jpg" alt="Video 2" />
          <div class="description">Watch our Latest Special</div>
        </div>
      </a>
      <!-- Add other videos here... -->
    </div>
  </section>

  <div class="feature-column">
    <!-- Feature boxes... -->
    <a href="OurShows.html" class="feature-link">
      <div class="feature-box left-img">
        <img src="images/The Show.png" alt="Feature 1" class="feature-img" />
        <div class="feature-text">Explore Our Shows</div>
      </div>
    </a>
    <!-- More features here... -->
  </div>
</main>

<script>
  const wheelContainer = document.querySelector('.wheel-container');
  const items = Array.from(wheelContainer.children);

  let isHovering = false;
  let scrollTimeout;
  const scrollStep = 1;
  const delay = 16;

  function duplicateItems() {
    const clone = items.map(item => item.cloneNode(true));
    clone.forEach(item => wheelContainer.appendChild(item));
  }

  function autoScroll() {
    if (isHovering) return;

    wheelContainer.scrollLeft += scrollStep;

    if (wheelContainer.scrollLeft >= wheelContainer.scrollWidth / 2) {
      wheelContainer.scrollLeft = 0;
    }

    scrollTimeout = setTimeout(autoScroll, delay);
  }

  function startAutoScroll() {
    clearTimeout(scrollTimeout);
    autoScroll();
  }

  function stopAutoScroll() {
    clearTimeout(scrollTimeout);
  }

  window.addEventListener('load', () => {
    duplicateItems();
    startAutoScroll();

    wheelContainer.addEventListener('mouseenter', () => {
      isHovering = true;
      stopAutoScroll();
    });

    wheelContainer.addEventListener('mouseleave', () => {
      isHovering = false;
      startAutoScroll();
    });
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.2 });

  document.querySelectorAll('.feature-box').forEach(box => {
    observer.observe(box);
  });
</script>

</body>
</html>
