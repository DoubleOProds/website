  <style>
    .feature-img {
      width: 100%;
      max-width: 240px;
      filter: grayscale(0%);
      height: auto;
      transition: filter 0.3s, transform 0.3s;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .feature-img:hover {
      transform: scale(1.01);
      filter: grayscale(0%);
    }

    h1, h2 {
      text-decoration: underline;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    #preview-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border: 3px solid black;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: none;
      z-index: 1000;
      max-width: 400px;
      max-height: 90vh;
    }
  
  #preview-box img {
  width: 100%;
  height: auto;
  border-radius: 12px;
  }



    .artist {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      width: 200px;
    }

    .artist-name {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .show-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    @media (max-width: 600px) {
      .artist {
        width: 100%;
        max-width: 300px;
      }

      .show-container {
        justify-content: center;
      }
    }

    .image-rotator img {
      transition: opacity 0.5s ease-in-out;
      cursor: pointer;
    }

    /* Lightbox overlay for enlarged rotating image */
    #lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: auto;
      transition: opacity 0.3s ease-in-out;
      visibility: hidden;
    }

    #lightbox.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #lightbox-img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    #lightbox.visible #lightbox-img {
      opacity: 1;
      transform: scale(1.05);
    }
  </style>
</head>

  <script>
  const previewBox = document.getElementById('preview-box');
  const previewImg = document.getElementById('preview-img');

  let rotationInterval;
  let currentImages = [];
  let currentIndex = 0;
  let isPreviewActive = false;

  function startPreview(images) {
    currentImages = images;
    currentIndex = 0;
    previewImg.src = currentImages[0];
    previewBox.style.display = 'block';

    rotationInterval = setInterval(() => {
      currentIndex = (currentIndex + 1) % currentImages.length;
      previewImg.src = currentImages[currentIndex];
    }, 2000);
  }

  function stopPreview() {
    previewBox.style.display = 'none';
    clearInterval(rotationInterval);
  }

  // Setup event listeners for all merch items
  document.querySelectorAll('.image-rotator').forEach(rotator => {
    const images = JSON.parse(rotator.dataset.images);

    rotator.addEventListener('mouseenter', () => {
      startPreview(images);
    });

    rotator.addEventListener('mouseleave', (e) => {
      setTimeout(() => {
        if (!previewBox.matches(':hover')) {
          stopPreview();
        }
      }, 100);
    });
  });

  // Hide when leaving preview box
  previewBox.addEventListener('mouseleave', () => {
    stopPreview();
  });
</script>



<div id="preview-box">
