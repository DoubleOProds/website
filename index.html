<!-- JavaScript -->
<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.2 });

  document.querySelectorAll('.feature-box').forEach(box => {
    observer.observe(box);
  });

  const wheelContainer = document.querySelector('.wheel-container');
  let scrollAmount = 1;
  let scrollStep;
  let delay;

  const isPortraitPhone = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
  if (isPortraitPhone) {
    scrollStep = 3;
    delay = 4;
  } else {
    scrollStep = 3;
    delay = 4;
  }

  let scrollTimeout;
  let isHovering = false;

  function autoScroll() {
    if (!wheelContainer || isHovering) return;

    scrollAmount = wheelContainer.scrollLeft + scrollStep;

    // Loop back seamlessly when past half (because we duplicated videos)
    if (scrollAmount >= wheelContainer.scrollWidth / 2) {
      scrollAmount = 0;
    }

    wheelContainer.scrollTo({
      left: scrollAmount,
      behavior: 'smooth'
    });

    scrollTimeout = setTimeout(autoScroll, delay);
  }

  function startAutoScroll() {
    clearTimeout(scrollTimeout);
    autoScroll();
  }

  function stopAutoScroll() {
    clearTimeout(scrollTimeout);
  }

  window.addEventListener('load', () => {
    if (!wheelContainer) return;

    scrollAmount = wheelContainer.scrollLeft;
    startAutoScroll();

    wheelContainer.addEventListener('scroll', () => {
      scrollAmount = wheelContainer.scrollLeft;
    });

    wheelContainer.addEventListener('mouseenter', () => {
      isHovering = true;
      stopAutoScroll();
    });

    wheelContainer.addEventListener('mouseleave', () => {
      isHovering = false;
      startAutoScroll();
    });
  });
</script>
